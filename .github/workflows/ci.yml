name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # 테스트용 더미값 — 실제 외부 서비스는 Testcontainers / MockWebServer로 대체
  JWT_SECRET:              "ci-jwt-secret-must-be-at-least-32-characters-here!"
  GITHUB_CLIENT_ID:        "ci-client-id"
  GITHUB_CLIENT_SECRET:    "ci-client-secret"
  GITHUB_WEBHOOK_SECRET:   "ci-webhook-secret"
  CLAUDE_API_KEY:          "ci-api-key"
  APP_BASE_URL:            "http://localhost:8080"
  APP_FRONTEND_URL:        "http://localhost:3000"

jobs:
  # ── 테스트 ──────────────────────────────────────────────────────────────────
  test:
    name: Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
          cache-read-only: false

      - name: Run unit & integration tests
        run: gradle test --no-daemon
        # Testcontainers는 Docker-in-Docker로 자동 동작 (ubuntu-latest에 Docker 내장)

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: build/reports/tests/
          retention-days: 7

  # ── 빌드 ──────────────────────────────────────────────────────────────────
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build bootJar
        run: gradle bootJar --no-daemon -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: reviewbot-jar-${{ github.run_number }}
          path: build/libs/*.jar
          retention-days: 7

  # ── Docker 이미지 빌드 ──────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Container Registry 푸시 (GitHub Container Registry 사용 예시) ──────
      # 아래 시크릿을 GitHub 저장소에 등록한 뒤 주석 해제하세요:
      #   DOCKER_USERNAME / DOCKER_PASSWORD
      #   또는 ghcr.io를 사용할 경우 GITHUB_TOKEN으로 자동 인증 가능
      #
      # - name: Log in to GitHub Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false   # true로 변경 시 레지스트리 푸시
          tags: |
            reviewbot:latest
            reviewbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

